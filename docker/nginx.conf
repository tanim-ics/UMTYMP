server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text: the app's script is ~680 kB raw and ~210 kB gzipped, which is most of a slow first load.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Hashed build assets never change, so they can be cached for a year.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # nginx's type table has no .webmanifest; without this the app manifest goes out as octet-stream (Task 23).
    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Single-page app: unknown paths fall back to index.html for client-side routing.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
