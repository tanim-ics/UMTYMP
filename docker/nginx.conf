server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets never change, so they can be cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # nginx's type table has no .webmanifest; without this the app manifest goes out as octet-stream (Task 23).
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Single-page app: unknown paths fall back to index.html for client-side routing.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
