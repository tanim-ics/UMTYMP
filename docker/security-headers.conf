# Security headers for every response (Task 24). Each location in nginx.conf includes this file, because a location
# with its own add_header drops the server's. vite.config.ts reads the same file for `vite preview`, so the browser
# tests run under this exact policy. tests/unit/securityHeaders.test.ts checks it.
#
# style-src allows inline styles: KaTeX positions every glyph with a style attribute. Scripts stay 'self' only.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
