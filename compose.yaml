services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      # Keep the container's node_modules instead of the (empty) host folder.
      - /app/node_modules

  # One-off checks: `docker compose run --rm check npm run check:task`.
  check:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: check
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run check:task

  # Browser tests against the dev server it starts itself: `docker compose run --rm e2e`.
  e2e:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: e2e
    volumes:
      - .:/app
      - /app/node_modules
    # Chromium needs more shared memory than Docker's 64 MB default.
    ipc: host

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    ports:
      - '8080:80'
